<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Galerie — Filtres en RA : jouer avec son apparence</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        body {
            font-family: "Comfortaa", Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
            line-height: 1.6;
            background: #000000;
            color: #39ff88;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 2.2rem;
            line-height: 1.25;
            font-weight: 700;
        }

        .intro {
            margin-bottom: 30px;
            color: #9affc0;
        }

        .retour {
            display: inline-block;
            margin-bottom: 30px;
            color: #9affc0;
            text-decoration: none;
            font-size: 14px;
        }

        .retour:hover {
            text-decoration: underline;
        }

        .galerie {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
        }

        .projet {
            display: block;
            padding: 22px;
            border: 1px solid #39ff88;
            border-radius: 12px;
            background: #000000;
            color: #39ff88;
            text-decoration: none;
            transition:
                background-color 0.2s ease,
                color 0.2s ease,
                transform 0.2s ease;
        }

        .projet:hover {
            background: #39ff88;
            color: #000000;
            transform: translateY(-3px);
        }

        .projet h2 {
            margin: 0 0 10px 0;
            font-size: 1.25rem;
            font-weight: 600;
        }

        .projet p {
            margin: 0;
            font-size: 14px;
            opacity: 0.8;
        }

        .chargement,
        .vide,
        .erreur {
            padding: 25px;
            border: 1px solid #39ff88;
            border-radius: 12px;
        }

        .erreur {
            color: #ff8f8f;
            border-color: #ff8f8f;
        }

        footer {
            margin-top: 50px;
            padding-top: 20px;
            border-top: 1px solid #39ff88;
            font-size: 12px;
            color: #9affc0;
        }

        footer a {
            color: #9affc0;
        }

        @media (max-width: 600px) {
            body {
                padding: 30px 15px;
            }

            h1 {
                font-size: 1.8rem;
            }

            .galerie {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <a class="retour" href="index.html">
        ← Retour à l'accueil
    </a>

    <h1>Galerie des projets</h1>

    <p class="intro">
        Découvre les projets réalisés dans le cadre de l’atelier
        <strong>Filtres en RA : jouer avec son apparence</strong>.
    </p>

    <div id="conteneur">
        <div class="chargement">
            Chargement des projets…
        </div>
    </div>

    <footer>
        © 2026 Kloé Montreuil<br>
        Plateforme d'accompagnement de l'atelier
        <a href="index.html">
            Filtres en RA : jouer avec son apparence
        </a>
    </footer>

    <script>
        const URL_LISTE =
            "https://urwltolhssartivabvut.supabase.co/functions/v1/liste-projets";

        const conteneur = document.getElementById("conteneur");

        async function chargerProjets() {
            try {
                const reponse = await fetch(URL_LISTE);

                if (!reponse.ok) {
                    throw new Error("Impossible de charger les projets.");
                }

                const donnees = await reponse.json();
                const projets = donnees.projets || [];

                if (projets.length === 0) {
                    conteneur.innerHTML = `
                        <div class="vide">
                            Aucun projet n'a encore été déposé.
                        </div>
                    `;
                    return;
                }

                const galerie = document.createElement("div");
                galerie.className = "galerie";

                projets.forEach(projet => {
                    const lien = document.createElement("a");

                    lien.className = "projet";
                    lien.href =
                        `projets/${encodeURIComponent(projet.slug)}/`;
                    lien.target = "_blank";
                    lien.rel = "noopener noreferrer";

                    const titre = document.createElement("h2");
                    titre.textContent =
    projet.nom_projet || projet.pseudonyme;

                    const description = document.createElement("p");
                    description.textContent = "Voir le projet →";

                    lien.appendChild(titre);
                    lien.appendChild(description);

                    galerie.appendChild(lien);
                });

                conteneur.innerHTML = "";
                conteneur.appendChild(galerie);

            } catch (erreur) {
                console.error(erreur);

                conteneur.innerHTML = `
                    <div class="erreur">
                        Impossible de charger les projets.
                    </div>
                `;
            }
        }

        chargerProjets();
    </script>

</body>
</html>
