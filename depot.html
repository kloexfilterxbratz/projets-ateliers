<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Déposer mon projet</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 60px auto;
            padding: 20px;
            line-height: 1.6;
        }

        h1 {
            margin-bottom: 10px;
        }

        .formulaire {
            border: 1px solid #ccc;
            padding: 25px;
            border-radius: 10px;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            font-size: 16px;
        }

        button {
            margin-top: 25px;
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        #message {
            margin-top: 20px;
            font-weight: bold;
        }

        #code {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #f3f3f3;
            border-radius: 8px;
        }

        #codeSecret {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
        }
    </style>
</head>

<body>

    <h1>Déposer mon projet</h1>

    <p>
        Tu peux déposer ici ton projet réalisé pendant l'atelier.
    </p>

    <div class="formulaire">

        <label for="pseudo">Mon pseudonyme</label>

        <input
            type="text"
            id="pseudo"
            maxlength="50"
            placeholder="Ex. Lune"
            required
        >

        <label for="fichier">Mon projet ZIP</label>

        <input
            type="file"
            id="fichier"
            accept=".zip"
            required
        >

        <button id="envoyer">
            Envoyer mon projet
        </button>

        <div id="message"></div>

        <div id="code">

            <p>
                Ton projet a été créé !
            </p>

            <p>
                Voici ton code secret :
            </p>

            <div id="codeSecret"></div>

            <p>
                <strong>Conserve bien ce code.</strong>
                Il te permettra de modifier ton projet plus tard.
            </p>

        </div>

    </div>

    <script>

        const SUPABASE_FUNCTION =
            "https://urwltolhssartivabvut.supabase.co/functions/v1/upload-submission";

        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_7C6P_-oSh9GJ-Qj11dfA-Q_4jGc-wKp";


        const bouton =
            document.getElementById("envoyer");

        const message =
            document.getElementById("message");

        const zoneCode =
            document.getElementById("code");

        const codeSecret =
            document.getElementById("codeSecret");


        bouton.addEventListener("click", async () => {

            const pseudo =
                document.getElementById("pseudo").value.trim();

            const fichier =
                document.getElementById("fichier").files[0];


            zoneCode.style.display = "none";


            if (!pseudo) {

                message.textContent =
                    "Veuillez entrer un pseudonyme.";

                return;
            }


            if (!fichier) {

                message.textContent =
                    "Veuillez sélectionner un fichier ZIP.";

                return;
            }


            if (!fichier.name.toLowerCase().endsWith(".zip")) {

                message.textContent =
                    "Le fichier doit être au format ZIP.";

                return;
            }


            if (fichier.size > 50 * 1024 * 1024) {

                message.textContent =
                    "Le fichier doit faire moins de 50 MB.";

                return;
            }


            bouton.disabled = true;

            message.textContent =
                "Création de ton projet...";


            try {

                /*
                 * 1. Créer le projet
                 */

                const response = await fetch(
                    SUPABASE_FUNCTION,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json",
                            "apikey": SUPABASE_PUBLISHABLE_KEY
                        },

                        body: JSON.stringify({
                            pseudonyme: pseudo
                        })
                    }
                );


                const resultat =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        resultat.error ||
                        "Impossible de créer le projet."
                    );
                }


                /*
                 * 2. Afficher le code secret
                 */

                codeSecret.textContent =
                    resultat.code_secret;

                zoneCode.style.display =
                    "block";


                /*
                 * 3. Envoyer réellement le ZIP
                 */

                message.textContent =
                    "Envoi du fichier...";


                const uploadResponse = await fetch(
                    `https://urwltolhssartivabvut.supabase.co/storage/v1/object/upload/sign/Soumissions/${resultat.upload.path}?token=${resultat.upload.token}`,
                    {
                        method: "PUT",

                        headers: {
                            "Content-Type": "application/zip"
                        },

                        body: fichier
                    }
                );


                if (!uploadResponse.ok) {

                    const details =
                        await uploadResponse.text();

                    console.error(
                        "Erreur Storage :",
                        details
                    );

                    throw new Error(
                        "Le fichier n'a pas pu être envoyé."
                    );
                }


                /*
                 * 4. Tout est terminé
                 */

                message.textContent =
                    "✓ Ton projet a été reçu avec succès !";


                document.getElementById("pseudo").value =
                    "";

                document.getElementById("fichier").value =
                    "";


            } catch (erreur) {

                console.error(erreur);

                message.textContent =
                    "Une erreur est survenue : " +
                    erreur.message;

            } finally {

                bouton.disabled = false;

            }

        });

    </script>

</body>
</html>
