name: Supprimer un projet

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Slug du projet à supprimer"
        required: true
        type: string

permissions:
  contents: write

jobs:
  supprimer:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Valider le slug
        env:
          SLUG: ${{ inputs.slug }}
        run: |
          if [[ ! "$SLUG" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "Slug invalide : $SLUG"
            exit 1
          fi

          echo "Slug valide : $SLUG"

      - name: Vérifier que le projet existe
        env:
          SLUG: ${{ inputs.slug }}
        run: |
          if [ ! -d "projets/$SLUG" ]; then
            echo "Le dossier projets/$SLUG n'existe pas."
            exit 1
          fi

          echo "Projet trouvé : projets/$SLUG"

      - name: Supprimer le projet
        env:
          SLUG: ${{ inputs.slug }}
        run: |
          rm -rf "projets/$SLUG"

          echo "Projet supprimé du dépôt : projets/$SLUG"

      - name: Supprimer le statut de publication
        env:
          SLUG: ${{ inputs.slug }}
        run: |
          rm -f "publication-status/$SLUG.json"

          echo "Statut supprimé : publication-status/$SLUG.json"

      - name: Vérifier la suppression
        env:
          SLUG: ${{ inputs.slug }}
        run: |
          if [ -e "projets/$SLUG" ]; then
            echo "Le dossier du projet existe encore."
            exit 1
          fi

          if [ -e "publication-status/$SLUG.json" ]; then
            echo "Le fichier de statut existe encore."
            exit 1
          fi

          echo "Suppression vérifiée."

      - name: Publier les changements
        env:
          SLUG: ${{ inputs.slug }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            "projets/$SLUG" \
            "publication-status/$SLUG.json"

          git commit \
            -m "Supprimer le projet $SLUG"

          git push

      - name: Confirmation
        env:
          SLUG: ${{ inputs.slug }}
        run: |
          echo "Le projet $SLUG a été supprimé de GitHub."
