name: Publier un projet

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Slug du projet"
        required: true
        type: string

      download_url:
        description: "URL temporaire du ZIP"
        required: true
        type: string

      publication_id:
        description: "Identifiant de publication"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publier:
    runs-on: ubuntu-latest

    steps:

      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Télécharger le ZIP
        env:
          DOWNLOAD_URL: ${{ inputs.download_url }}
        run: |
          curl \
            --fail \
            --location \
            --retry 3 \
            "$DOWNLOAD_URL" \
            --output projet.zip

      - name: Valider le ZIP
        id: validation
        continue-on-error: true
        run: |
          python3 <<'PY'
          import os
          import stat
          import zipfile

          zip_path = "projet.zip"

          MAX_FICHIERS = 5000
          MAX_TAILLE_DECOMPRESSEE = 300 * 1024 * 1024

          with zipfile.ZipFile(zip_path, "r") as archive:

              membres = archive.infolist()

              if not membres:
                  raise RuntimeError(
                      "Le ZIP est vide."
                  )

              if len(membres) > MAX_FICHIERS:
                  raise RuntimeError(
                      f"Le ZIP contient trop de fichiers : "
                      f"{len(membres)}. "
                      f"Maximum autorisé : {MAX_FICHIERS}."
                  )

              index_trouve = False
              taille_totale = 0

              for member in membres:

                  name = member.filename.replace("\\", "/")

                  if "\x00" in name:
                      raise RuntimeError(
                          f"Nom de fichier invalide : {name!r}"
                      )

                  if name.startswith("/"):
                      raise RuntimeError(
                          f"Chemin absolu interdit : {name}"
                      )

                  parts = name.split("/")

                  if ".." in parts:
                      raise RuntimeError(
                          f"Chemin invalide : {name}"
                      )

                  if name == "index.html":
                      index_trouve = True

                  taille_totale += member.file_size

                  if taille_totale > MAX_TAILLE_DECOMPRESSEE:
                      raise RuntimeError(
                          "La taille totale du projet une fois "
                          "décompressé dépasse 300 Mo."
                      )

                  mode = (member.external_attr >> 16) & 0o170000

                  if mode == stat.S_IFLNK:
                      raise RuntimeError(
                          f"Les liens symboliques sont interdits : {name}"
                      )

              if not index_trouve:
                  raise RuntimeError(
                      "Le ZIP doit contenir un fichier "
                      "index.html à sa racine."
                  )

              print("Validation du ZIP réussie.")
              print(f"Nombre de fichiers : {len(membres)}")
              print(
                  f"Taille décompressée : "
                  f"{taille_totale / (1024 * 1024):.2f} Mo"
              )
          PY

      - name: Enregistrer l'échec de validation
        if: steps.validation.outcome == 'failure'
        env:
          SLUG: ${{ inputs.slug }}
          PUBLICATION_ID: ${{ inputs.publication_id }}
        run: |
          mkdir -p "publication-status"

          cat > "publication-status/$SLUG.json" <<EOF
          {
            "publication_id": "$PUBLICATION_ID",
            "status": "error",
            "message": "Ton fichier ZIP n'est pas valide. Il doit contenir un fichier index.html à la racine."
          }
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "publication-status/$SLUG.json"

          git commit \
            -m "Enregistrer l'échec de publication $SLUG" \
            || echo "Aucun changement à publier"

          git push

          exit 1

      - name: Préparer le dossier du projet
        env:
          SLUG: ${{ inputs.slug }}
        run: |
          rm -rf "projets/$SLUG"
          mkdir -p "projets/$SLUG"

      - name: Décompresser le projet
        env:
          SLUG: ${{ inputs.slug }}
        run: |
          python3 <<'PY'
          import os
          import zipfile

          slug = os.environ["SLUG"]
          zip_path = "projet.zip"
          destination = os.path.join("projets", slug)

          with zipfile.ZipFile(zip_path, "r") as archive:

              for member in archive.infolist():

                  name = member.filename.replace("\\", "/")

                  if name.startswith("/"):
                      raise RuntimeError(
                          f"Chemin absolu interdit : {name}"
                      )

                  parts = name.split("/")

                  if ".." in parts:
                      raise RuntimeError(
                          f"Chemin invalide : {name}"
                      )

                  cible = os.path.abspath(
                      os.path.join(destination, name)
                  )

                  racine = os.path.abspath(
                      destination
                  )

                  if not (
                      cible == racine
                      or cible.startswith(
                          racine + os.sep
                      )
                  ):
                      raise RuntimeError(
                          f"Chemin hors du projet : {name}"
                      )

                  archive.extract(
                      member,
                      destination
                  )

          print(
              f"Projet décompressé dans {destination}"
          )
          PY

      - name: Ajouter le nouvel écran de chargement
        env:
          SLUG: ${{ inputs.slug }}
        run: |
          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          slug = os.environ["SLUG"]
          dossier = Path("projets") / slug
          index = dossier / "index.html"

          if not index.exists():
              raise RuntimeError("index.html introuvable.")

          html = index.read_text(encoding="utf-8")

          # Ajouter le fichier JavaScript une seule fois
          script_tag = '<script defer src="./custom-loader.js"></script>'

          if "custom-loader.js" not in html:
              html = html.replace("</head>", script_tag + "</head>")

          # Trouver le fichier CSS du projet
          match = re.search(
              r'<link[^>]+href="([^"]+\.css)"',
              html
          )

          if not match:
              raise RuntimeError("Fichier CSS introuvable.")

          css_path = dossier / match.group(1).replace("./", "", 1)

          if not css_path.exists():
              raise RuntimeError("Fichier CSS introuvable : " + str(css_path))

          css = css_path.read_text(encoding="utf-8")

          # Ajouter les styles sans créer de doublons
          marker = "/* CUSTOM MINDAR LOADER */"
          css = re.sub(
              r'/\* CUSTOM MINDAR LOADER \*/.*?/\* END CUSTOM MINDAR LOADER \*/',
              '',
              css,
              flags=re.S
          )

          css += """
          /* CUSTOM MINDAR LOADER */
          #mindar-loading {
            visibility: hidden !important;
          }

          #custom-mindar-loader {
            position: fixed;
            inset: 0;
            z-index: 99999;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.94);
            pointer-events: none;
          }

          #custom-mindar-loader.visible {
            display: flex;
          }

          #custom-mindar-loader model-viewer {
            width: min(58vw, 280px);
            height: min(58vw, 280px);
            background: transparent;
            --poster-color: transparent;
          }
          /* END CUSTOM MINDAR LOADER */
          """

          css_path.write_text(css, encoding="utf-8")
          index.write_text(html, encoding="utf-8")

          # Créer le JavaScript de l'écran personnalisé
          loader = r'''
          (() => {
            const MODEL_PATH = "../../modeles/oeil_mirror.glb";
            const LOADER_ID = "custom-mindar-loader";

            function installLoader() {
              if (document.getElementById(LOADER_ID)) return;

              const overlay = document.createElement("div");
              overlay.id = LOADER_ID;

              overlay.innerHTML = `
                <model-viewer
                  src="${MODEL_PATH}"
                  alt="Œil en trois dimensions"
                  auto-rotate
                  rotation-per-second="18deg"
                  interaction-prompt="none"
                  disable-zoom
                  camera-controls
                  exposure="1"
                  shadow-intensity="0.4">
                </model-viewer>
              `;

              document.body.appendChild(overlay);

              const update = () => {
                const mindarLoader =
                  document.getElementById("mindar-loading");

                const isLoading =
                  !!mindarLoader &&
                  !mindarLoader.classList.contains("hidden");

                overlay.classList.toggle("visible", isLoading);
              };

              const observer = new MutationObserver(update);

              observer.observe(document.body, {
                childList: true,
                subtree: true,
                attributes: true,
                attributeFilter: ["class"]
              });

              update();
            }

            function loadModelViewer() {
              if (customElements.get("model-viewer")) {
                installLoader();
                return;
              }

              const script = document.createElement("script");
              script.type = "module";
              script.src =
                "https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js";

              script.onload = installLoader;

              script.onerror = () =>
                console.error("Impossible de charger le visualiseur 3D.");

              document.head.appendChild(script);
            }

            if (document.readyState === "loading") {
              document.addEventListener(
                "DOMContentLoaded",
                loadModelViewer,
                { once: true }
              );
            } else {
              loadModelViewer();
            }
          })();
          '''

          (dossier / "custom-loader.js").write_text(
              loader.strip() + "\n",
              encoding="utf-8"
          )

          print("Écran de chargement personnalisé ajouté.")
          print("Modèle : ../../modeles/oeil_mirror.glb")
          PY

      - name: Supprimer le ZIP temporaire
        run: |
          rm -f projet.zip

      - name: Enregistrer l'identifiant de publication
        env:
          SLUG: ${{ inputs.slug }}
          PUBLICATION_ID: ${{ inputs.publication_id }}
        run: |
          echo "$PUBLICATION_ID" > "projets/$SLUG/.publication-id"

      - name: Vérifier le projet
        env:
          SLUG: ${{ inputs.slug }}
        run: |
          if [ ! -d "projets/$SLUG" ]; then
            echo "Le dossier du projet n'existe pas."
            exit 1
          fi

          if [ ! -f "projets/$SLUG/index.html" ]; then
            echo "index.html est absent de la racine du projet."
            exit 1
          fi

          echo "Contenu du projet :"
          find "projets/$SLUG" -maxdepth 3 -type f | head -100

      - name: Enregistrer la réussite de publication
        env:
          SLUG: ${{ inputs.slug }}
          PUBLICATION_ID: ${{ inputs.publication_id }}
        run: |
          mkdir -p "publication-status"

          cat > "publication-status/$SLUG.json" <<EOF
          {
            "publication_id": "$PUBLICATION_ID",
            "status": "success",
            "message": "Publication terminée."
          }
          EOF

          git add "publication-status/$SLUG.json"

      - name: Publier les changements
        env:
          SLUG: ${{ inputs.slug }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "projets/$SLUG"

          git commit \
            -m "Publier le projet $SLUG" \
            || echo "Aucun changement à publier"

          git push

      - name: Confirmer la publication
        env:
          SLUG: ${{ inputs.slug }}
          PUBLICATION_ID: ${{ inputs.publication_id }}
        run: |
          echo "Publication terminée."
          echo "Projet : $SLUG"
          echo "Identifiant de publication : $PUBLICATION_ID"
