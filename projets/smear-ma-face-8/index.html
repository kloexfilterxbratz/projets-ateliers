<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <link rel="icon" href="./favicon.png"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="theme-color" content="#000000"/>
  <meta name="description" content="WebAR built with MindAR Studio"/>
  <link rel="apple-touch-icon" href="./favicon.png"/>
  <link rel="manifest" href="./manifest.json"/>
  <title>MindAR App</title>

  <style>
    #custom-mindar-loader {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    #custom-mindar-loader:not(.visible) {
      display: none;
    }

    #custom-mindar-loader model-viewer {
      width: min(58vw, 280px);
      height: min(58vw, 280px);
      background: transparent;
      --poster-color: transparent;
    }

    #mindar-loading {
      display: none !important;
    }
  </style>

  <script defer="defer" src="./static/js/main.1573730f.js"></script>
  <link href="./static/css/main.43335a5b.css" rel="stylesheet"/>
  <script defer src="./custom-loader.js"></script>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>

  <div id="custom-mindar-loader" class="visible">
    <model-viewer
      src="../../modeles/oeil_mirror.glb"
      alt="Œil en trois dimensions"
      auto-rotate
      rotation-per-second="18deg"
      interaction-prompt="none"
      disable-zoom
      exposure="1"
      shadow-intensity="0.4">
    </model-viewer>
  </div>

  <div id="root"></div>
</body>
</html>
