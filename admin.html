<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administration — Atelier RA</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px;
            background: #f7f7f7;
            color: #222;
        }

        h1 {
            margin-bottom: 8px;
        }

        .intro {
            margin-bottom: 30px;
            color: #666;
        }

        .connexion {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            max-width: 500px;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            margin-top: 12px;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        .principal {
            background: #222;
            color: white;
        }

        .supprimer {
            background: #b00020;
            color: white;
            margin-top: 0;
            padding: 8px 12px;
            font-size: 14px;
        }

        .supprimer:hover {
            opacity: 0.85;
        }

        button:disabled {
            opacity: 0.5;
            cursor: wait;
        }

        #message {
            margin-top: 15px;
        }

        .tableau {
            background: white;
            border-radius: 12px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            text-align: left;
            padding: 14px;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #eee;
        }

        .aucun {
            padding: 30px;
            text-align: center;
            color: #666;
        }

        .erreur {
            color: #b00020;
        }

        .succes {
            color: #087f23;
        }

        @media (max-width: 700px) {

            table {
                font-size: 14px;
            }

            th,
            td {
                padding: 10px 8px;
            }

            .colonne-date {
                display: none;
            }
        }
    </style>
</head>

<body>

    <h1>Administration</h1>

    <p class="intro">
        Gestion des projets de l’atelier de réalité augmentée.
    </p>

    <section class="connexion">

        <label for="secret">
            Secret administrateur
        </label>

        <br><br>

        <input
            id="secret"
            type="password"
            autocomplete="off"
            placeholder="Entrer le secret administrateur"
        >

        <br>

        <button
            class="principal"
            onclick="chargerProjets()"
        >
            Voir les projets
        </button>

        <div id="message"></div>

    </section>

    <section
        id="resultats"
        class="tableau"
        style="display: none;"
    >

        <table>

            <thead>
                <tr>
                    <th>Pseudonyme</th>
                    <th>Slug</th>
                    <th class="colonne-date">Date</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="listeProjets"></tbody>

        </table>

    </section>

    <script>

        const URL_ADMIN =
            "https://urwltolhssartivabvut.supabase.co/functions/v1/admin-projets";

        const URL_SUPPRESSION =
            "https://urwltolhssartivabvut.supabase.co/functions/v1/admin-supprimer";


        async function chargerProjets() {

            const secret =
                document.getElementById("secret").value.trim();

            const message =
                document.getElementById("message");

            const resultats =
                document.getElementById("resultats");

            const liste =
                document.getElementById("listeProjets");


            message.textContent =
                "Chargement...";

            message.className = "";

            resultats.style.display = "none";

            liste.innerHTML = "";


            if (!secret) {

                message.textContent =
                    "Entre ton secret administrateur.";

                message.className =
                    "erreur";

                return;
            }


            try {

                const reponse =
                    await fetch(
                        URL_ADMIN,
                        {
                            headers: {
                                "x-admin-secret":
                                    secret
                            }
                        }
                    );


                const donnees =
                    await reponse.json();


                if (!reponse.ok) {

                    throw new Error(
                        donnees.error ||
                        "Accès refusé."
                    );
                }


                if (
                    !donnees.success ||
                    !Array.isArray(donnees.projets)
                ) {

                    throw new Error(
                        "Réponse inattendue du serveur."
                    );
                }


                if (
                    donnees.projets.length === 0
                ) {

                    liste.innerHTML = `
                        <tr>
                            <td
                                colspan="4"
                                class="aucun"
                            >
                                Aucun projet.
                            </td>
                        </tr>
                    `;

                } else {

                    donnees.projets.forEach(
                        projet => {

                            const ligne =
                                document.createElement("tr");


                            const pseudonyme =
                                document.createElement("td");

                            pseudonyme.textContent =
                                projet.pseudonyme;


                            const slug =
                                document.createElement("td");

                            slug.textContent =
                                projet.slug;


                            const date =
                                document.createElement("td");

                            date.className =
                                "colonne-date";

                            date.textContent =
                                new Date(
                                    projet.created_at
                                ).toLocaleString(
                                    "fr-CA"
                                );


                            const action =
                                document.createElement("td");


                            const bouton =
                                document.createElement(
                                    "button"
                                );

                            bouton.className =
                                "supprimer";

                            bouton.textContent =
                                "🗑️ Supprimer";


                            bouton.onclick =
                                () =>
                                    supprimerProjet(
                                        projet.slug,
                                        projet.pseudonyme,
                                        bouton
                                    );


                            action.appendChild(
                                bouton
                            );


                            ligne.appendChild(
                                pseudonyme
                            );

                            ligne.appendChild(
                                slug
                            );

                            ligne.appendChild(
                                date
                            );

                            ligne.appendChild(
                                action
                            );


                            liste.appendChild(
                                ligne
                            );

                        }
                    );
                }


                resultats.style.display =
                    "block";

                message.textContent =
                    `${donnees.projets.length} projet(s) trouvé(s).`;

            } catch (erreur) {

                console.error(erreur);

                message.textContent =
                    erreur.message;

                message.className =
                    "erreur";
            }
        }


        async function supprimerProjet(
            slug,
            pseudonyme,
            bouton
        ) {

            const secret =
                document.getElementById("secret").value.trim();

            const message =
                document.getElementById("message");


            if (!secret) {

                message.textContent =
                    "Entre ton secret administrateur.";

                message.className =
                    "erreur";

                return;
            }


            const confirmation =
                confirm(
                    `Supprimer le projet "${pseudonyme}" (${slug}) ?\n\n` +
                    "Cette action supprimera le projet de Supabase " +
                    "et de GitHub.\n\n" +
                    "Cette action est irréversible."
                );


            if (!confirmation) {
                return;
            }


            bouton.disabled = true;

            bouton.textContent =
                "Suppression...";

            message.className = "";

            message.textContent =
                `Suppression de ${slug} en cours...`;


            try {

                const reponse =
                    await fetch(
                        URL_SUPPRESSION,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json",

                                "x-admin-secret":
                                    secret
                            },

                            body: JSON.stringify({
                                slug: slug
                            })
                        }
                    );


                const donnees =
                    await reponse.json();


                if (!reponse.ok) {

                    throw new Error(
                        donnees.error ||
                        "Impossible de supprimer le projet."
                    );
                }


                if (!donnees.success) {

                    throw new Error(
                        "La suppression n'a pas été confirmée."
                    );
                }


                message.textContent =
                    `✓ ${slug} a été supprimé.`;

                message.className =
                    "succes";


                const ligne =
                    bouton.closest("tr");

                if (ligne) {
                    ligne.remove();
                }


            } catch (erreur) {

                console.error(erreur);

                message.textContent =
                    "⚠️ " + erreur.message;

                message.className =
                    "erreur";

                bouton.disabled = false;

                bouton.textContent =
                    "🗑️ Supprimer";
            }
        }

    </script>

</body>
</html>
