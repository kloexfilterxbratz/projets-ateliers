<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administration — Filtres en RA : jouer avec son apparence</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        body {
            font-family: "Comfortaa", Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
            line-height: 1.6;
            background: #000000;
            color: #39ff88;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 2.2rem;
            line-height: 1.25;
            font-weight: 700;
        }

        .intro {
            margin-bottom: 30px;
            color: #9affc0;
        }

        .retour {
            display: inline-block;
            margin-bottom: 30px;
            color: #9affc0;
            text-decoration: none;
            font-size: 14px;
        }

        .retour:hover {
            text-decoration: underline;
        }

        .connexion {
            border: 1px solid #39ff88;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input[type="password"] {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            font-family: "Comfortaa", Arial, sans-serif;
            font-size: 16px;
            background: #000000;
            color: #39ff88;
            border: 1px solid #39ff88;
            border-radius: 7px;
        }

        input[type="password"]:focus {
            outline: 2px solid #9affc0;
            outline-offset: 2px;
        }

        button {
            margin-top: 20px;
            padding: 12px 20px;
            border: 2px solid #39ff88;
            border-radius: 8px;
            font-family: "Comfortaa", Arial, sans-serif;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            background: #000000;
            color: #39ff88;
        }

        button:hover {
            background: #39ff88;
            color: #000000;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .message {
            margin-top: 15px;
            color: #9affc0;
        }

        .erreur {
            color: #ff8f8f;
        }

        .projets {
            border: 1px solid #39ff88;
            border-radius: 12px;
            padding: 25px;
        }

        .projets h2 {
            margin-top: 0;
            font-size: 1.4rem;
        }

        .tableau {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .tableau th,
        .tableau td {
            padding: 14px 10px;
            border-bottom: 1px solid #276b43;
            text-align: left;
            vertical-align: middle;
        }

        .tableau th {
            color: #9affc0;
            font-weight: 600;
        }

        .tableau td {
            color: #39ff88;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .actions button {
            margin-top: 0;
            padding: 8px 12px;
            font-size: 13px;
        }

        .bouton-telecharger {
            border-color: #9affc0;
            color: #9affc0;
        }

        .bouton-supprimer {
            border-color: #ff8f8f;
            color: #ff8f8f;
        }

        .bouton-supprimer:hover {
            background: #ff8f8f;
            color: #000000;
        }

        .vide {
            padding: 20px 0;
            color: #9affc0;
        }

        footer {
            margin-top: 50px;
            padding-top: 20px;
            border-top: 1px solid #39ff88;
            font-size: 12px;
            color: #9affc0;
        }

        footer a {
            color: #9affc0;
        }

        @media (max-width: 700px) {
            body {
                padding: 30px 15px;
            }

            h1 {
                font-size: 1.8rem;
            }

            .tableau {
                display: block;
                overflow-x: auto;
            }

            .tableau th,
            .tableau td {
                white-space: nowrap;
            }
        }
    </style>
</head>

<body>

    <a class="retour" href="index.html">
        ← Retour à l'accueil
    </a>

    <h1>Administration</h1>

    <p class="intro">
        Gestion des projets déposés dans le cadre de l’atelier
        <strong>Filtres en RA : jouer avec son apparence</strong>.
    </p>

    <section class="connexion">
        <label for="secret">
            Secret administrateur
        </label>

        <input
            type="password"
            id="secret"
            autocomplete="off"
            placeholder="Entrer le secret administrateur"
        >

        <button id="charger">
            Voir les projets
        </button>

        <div id="message" class="message"></div>
    </section>

    <section class="projets">
        <h2>Projets déposés</h2>

        <div id="conteneur">
            <div class="vide">
                Aucun projet chargé.
            </div>
        </div>
    </section>

    <footer>
        © 2026 Kloé Montreuil<br>
        Plateforme d'accompagnement de l'atelier
        <a href="index.html">
            Filtres en RA : jouer avec son apparence
        </a>
    </footer>

    <script>
        const URL_ADMIN =
            "https://urwltolhssartivabvut.supabase.co/functions/v1/admin-projets";

        const URL_SUPPRESSION =
            "https://urwltolhssartivabvut.supabase.co/functions/v1/admin-supprimer";

        const URL_TELECHARGEMENT =
            "https://urwltolhssartivabvut.supabase.co/functions/v1/admin-telecharger";

        const secret = document.getElementById("secret");
        const charger = document.getElementById("charger");
        const message = document.getElementById("message");
        const conteneur = document.getElementById("conteneur");

        charger.addEventListener("click", chargerProjets);

        async function chargerProjets() {
            const valeurSecret = secret.value.trim();

            if (!valeurSecret) {
                message.textContent =
                    "Veuillez entrer le secret administrateur.";
                message.className = "message erreur";
                return;
            }

            charger.disabled = true;
            message.textContent = "Chargement…";
            message.className = "message";
            conteneur.innerHTML = "";

            try {
                const reponse = await fetch(URL_ADMIN, {
                    method: "GET",
                    headers: {
                        "x-admin-secret": valeurSecret
                    }
                });

                const donnees = await reponse.json();

                if (!reponse.ok) {
                    throw new Error(
                        donnees.error || "Impossible de charger les projets."
                    );
                }

                afficherProjets(donnees.projets || []);

                message.textContent =
                    `${donnees.projets.length} projet(s) trouvé(s).`;

            } catch (erreur) {
                console.error(erreur);

                message.textContent = erreur.message;
                message.className = "message erreur";

                conteneur.innerHTML = `
                    <div class="vide">
                        Impossible de charger les projets.
                    </div>
                `;

            } finally {
                charger.disabled = false;
            }
        }

        function afficherProjets(projets) {

            if (projets.length === 0) {
                conteneur.innerHTML = `
                    <div class="vide">
                        Aucun projet n'a encore été déposé.
                    </div>
                `;
                return;
            }

            const tableau = document.createElement("table");
            tableau.className = "tableau";

            tableau.innerHTML = `
            <thead>
    <tr>
        <th>Pseudonyme</th>
        <th>Nom du projet</th>
        <th>Slug</th>
        <th>Date</th>
        <th>Actions</th>
    </tr>
</thead>
                <tbody></tbody>
            `;

            const tbody = tableau.querySelector("tbody");

            projets.forEach(projet => {

                const ligne = document.createElement("tr");

                const pseudonyme = document.createElement("td");
                pseudonyme.textContent = projet.pseudonyme;
                
const nomProjet = document.createElement("td");
nomProjet.textContent = projet.nom_projet || projet.pseudonyme;
                
                const slug = document.createElement("td");
                slug.textContent = projet.slug;

                const date = document.createElement("td");
                date.textContent =
                    new Date(projet.created_at).toLocaleString("fr-CA");

                const actions = document.createElement("td");
                actions.className = "actions";

                const boutonTelecharger =
                    document.createElement("button");

                boutonTelecharger.textContent = "Télécharger";
                boutonTelecharger.className =
                    "bouton-telecharger";

                boutonTelecharger.addEventListener(
                    "click",
                    () => telechargerProjet(projet.slug)
                );
                const boutonRenommer = document.createElement("button");
boutonRenommer.textContent = "Renommer";
boutonRenommer.className = "bouton-renommer";

boutonRenommer.addEventListener("click", async () => {
    const nouveauNom = prompt(
        "Nouveau nom du projet :",
        projet.nom_projet || projet.pseudonyme
    );

    if (nouveauNom === null) {
        return;
    }

    const nom = nouveauNom.trim();

    if (!nom) {
        alert("Le nom du projet ne peut pas être vide.");
        return;
    }

    const reponse = await fetch(
        "https://urwltolhssartivabvut.supabase.co/functions/v1/admin-renommer-projet",
        {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
              "x-admin-secret": secret.value.trim()
            },
            body: JSON.stringify({
                id: projet.id,
                nom_projet: nom
            })
        }
    );

    const resultat = await reponse.json();

    if (!reponse.ok) {
        alert(resultat.error || "Impossible de renommer le projet.");
        return;
    }

    alert("Le projet a été renommé.");
    chargerProjets();
});

                const boutonSupprimer =
                    document.createElement("button");

                boutonSupprimer.textContent = "Supprimer";
                boutonSupprimer.className =
                    "bouton-supprimer";

                boutonSupprimer.addEventListener(
                    "click",
                    () => supprimerProjet(
                        projet.slug,
                        projet.pseudonyme
                    )
                );

             actions.appendChild(boutonTelecharger);
actions.appendChild(boutonRenommer);
actions.appendChild(boutonSupprimer);

                ligne.appendChild(pseudonyme);
ligne.appendChild(nomProjet);
ligne.appendChild(slug);
ligne.appendChild(date);
ligne.appendChild(actions);

                tbody.appendChild(ligne);
            });

            conteneur.appendChild(tableau);
        }

        async function telechargerProjet(slug) {

            try {
                const valeurSecret = secret.value.trim();

                const reponse = await fetch(
                    URL_TELECHARGEMENT,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "x-admin-secret": valeurSecret
                        },
                        body: JSON.stringify({
                            slug: slug
                        })
                    }
                );

                const donnees = await reponse.json();

                if (!reponse.ok) {
                    throw new Error(
                        donnees.error ||
                        "Impossible de préparer le téléchargement."
                    );
                }

                window.open(
                    donnees.download_url,
                    "_blank"
                );

            } catch (erreur) {
                console.error(erreur);
                alert(erreur.message);
            }
        }

        async function supprimerProjet(slug, pseudonyme) {

            const confirmation = confirm(
                `Supprimer définitivement le projet de « ${pseudonyme} » ?\n\n` +
                "Cette action supprimera le fichier du stockage, " +
                "le projet du dépôt GitHub et son entrée dans la base de données."
            );

            if (!confirmation) {
                return;
            }

            try {
                const valeurSecret = secret.value.trim();

                const reponse = await fetch(
                    URL_SUPPRESSION,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "x-admin-secret": valeurSecret
                        },
                        body: JSON.stringify({
                            slug: slug
                        })
                    }
                );

                const donnees = await reponse.json();

                if (!reponse.ok) {
                    throw new Error(
                        donnees.error ||
                        "Impossible de supprimer le projet."
                    );
                }

                alert(
                    "Le projet a été supprimé.\n\n" +
                    "La suppression du dossier GitHub est maintenant lancée."
                );

                await chargerProjets();

            } catch (erreur) {
                console.error(erreur);
                alert(erreur.message);
            }
        }
    </script>

</body>
</html>
